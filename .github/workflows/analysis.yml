name: Repository Structure Analysis

on:
  push:
    branches: [ arena/871ec1d8-test ]
  pull_request:
    branches: [ arena/871ec1d8-test ]

jobs:
  structure-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display repository structure
        run: |
          echo "Repository structure analysis:"
          ls -la
          find . -type f | head -20
          echo "No .exe files found in repository"

      - name: Generate analysis report
        run: |
          echo "Structure analysis completed successfully" > analysis_report.txt
          cat analysis_report.txt

      - name: Upload analysis as artifact
        uses: actions/upload-artifact@v4
        with:
          name: structure-analysis
          path: analysis_report.txt