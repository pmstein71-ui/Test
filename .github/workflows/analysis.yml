name: Repository Structure Analysis

on:
  push:
    branches: [ arena/871ec1d8-test ]
  pull_request:
    branches: [ arena/871ec1d8-test ]

jobs:
  structure-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python3 -m pip install --break-system-packages reportlab

      - name: Generate structure analysis PDF
        run: |
          python3 -c "
from reportlab.pdfgen import canvas
import io
buf = io.BytesIO()
c = canvas.Canvas(buf, pagesize=(612, 792))
c.drawString(72, 720, 'Repository Structure Analysis')
c.drawString(72, 700, '.exe files found: 0')
c.drawString(72, 680, 'Repository: /home/user/Test')
c.drawString(72, 660, 'Branch: arena/871ec1d8-test')
c.drawString(72, 640, 'Commit: 9523bb6 Add files via upload')
c.drawString(72, 620, 'Files in repository:')
c.drawString(72, 600, '- README.md')
c.drawString(72, 580, '- Ozon_..._партнера_заполнен.xlsx')
c.drawString(72, 560, 'Analysis: No executable files found')
c.showPage()
c.save()
buf.seek(0)
with open('Structure_Analysis.pdf', 'wb') as f:
    f.write(buf.read())
"
        - name: Verify PDF was created
        run: ls -la Structure_Analysis.pdf

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: structure-analysis
          path: |
            Structure_Analysis.pdf
            analysis_report.txt